server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studyspace}
spring.datasource.username=${DB_USER:studyspace}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
studyspace.upload-dir=${STUDYSPACE_UPLOAD_DIR:uploads}
studyspace.gemini-api-key=${GEMINI_API_KEY:}
studyspace.gemini-key-source=${STUDYSPACE_GEMINI_KEY_SOURCE:}
studyspace.gemini-model=${GEMINI_MODEL:gemini-3.5-flash-lite}
studyspace.gemini-api-base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
