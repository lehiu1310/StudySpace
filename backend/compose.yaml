services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studyspace
      POSTGRES_USER: studyspace
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - studyspace_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyspace"]
      interval: 5s
      retries: 10
volumes:
  studyspace_data:
